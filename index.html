<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100914">
  <title>Velvet Hearts ♡</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="intro">
    <video class="intro-video" autoplay muted loop playsinline
           preload="auto" aria-hidden="true">
      <source src="videos/anime-opening.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>
    <div class="glow"></div>
    <div class="intro-content">
      <p class="eyebrow">A LITTLE WORLD MADE OF LOVE</p>
      <h1>Velvet Hearts</h1>
      <p class="subtitle">Some stories are better when you step inside.</p>
      <label for="visitorName">What should we call you?</label>
      <input id="visitorName" type="text" maxlength="40"
             placeholder="Enter your name">
      <button id="enterButton">Enter Velvet Hearts ♡</button>
      <p class="hint">Your story begins here.</p>
    </div>
  </main>
  <script src="js/app.js"></script>
  <script src="js/velvet-random-music.js" defer></script>
<script src="js/velvet-welcome-music.js" defer></script>
  <script src="js/velvet-effects.js" defer></script>
  <script src="js/velvet-mobile.js" defer></script>
</body>
</html>
